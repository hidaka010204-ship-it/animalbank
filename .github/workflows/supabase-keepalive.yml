name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 UTC 00:00 (JST 09:00)
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/animals?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          # 200-4xx はすべて「サービス稼働中」とみなす (RLS 400 / anon 406 も正常)
          if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
            echo "Supabase unreachable or server error: $STATUS"
            exit 1
          fi
          echo "Supabase is alive."
